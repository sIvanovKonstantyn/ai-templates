# Local Redis for testing the event smoke tool (<tools>/smoke-events.py) without the dev instance.
# Start:  docker compose -f <tools>/smoke/docker-compose.redis.yml up -d --wait
# Stop:   docker compose -f <tools>/smoke/docker-compose.redis.yml down -v
# Matching connection settings: <tools>/smoke/smoke-redis.local.env
name: spec-smoke-redis
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "local-smoke-password", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "local-smoke-password", "--no-auth-warning", "ping"]
      interval: 1s
      timeout: 2s
      retries: 20
